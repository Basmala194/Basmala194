name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # الأداة الأصلية مع تشغيل تِم باكمان السحري
      - uses: Platane/snk@v3
        with:
          github_user_name: Basmala194
          outputs: |
            dist/github-pacman.svg?palette=github-dark&color_snake=#f9d71c&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
